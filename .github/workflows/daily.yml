name: Daily land sweep

on:
  schedule:
    # 13:15 UTC ≈ 9:15am Eastern - two hours after the Mac's 7am run, as a fallback
    - cron: '15 13 * * *'
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sweep Redfin
        # Zillow returns 403 to GitHub's servers, so this run is Redfin-only.
        # The full sweep with Zillow runs from the owner's Mac (scripts/daily-local.sh).
        env:
          SWEEP_SKIP_ZILLOW: "1"
          PAGE_FETCH_CAP: "0"
        run: python3 scripts/sweep.py

      - name: Summarise the run
        run: python3 scripts/report.py >> "$GITHUB_STEP_SUMMARY"

      - name: Commit any changes
        run: |
          git config user.name  "land-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracts.json data/report.json data/excluded.json photos
          if git diff --cached --quiet; then
            echo "Nothing changed — a quiet day is a cheap day."
            exit 0
          fi
          MSG=$(python3 scripts/report.py --commit-message)
          git commit -m "$MSG"
          # another device may have written data/hidden.json meanwhile
          git pull --rebase --autostash origin main
          git push
